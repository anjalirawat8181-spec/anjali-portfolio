<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — JOIN not found | Anjali Rawat</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <style>
      :root { --bg: #fff8e7; --fg: #111; --line: #000; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f5f5f5; --line: #fff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif;
        background-image: linear-gradient(rgb(127 127 127 / .12) 1px, transparent 1px), linear-gradient(90deg, rgb(127 127 127 / .12) 1px, transparent 1px); background-size: 40px 40px; }
      main { max-width: 38rem; }
      p.code { display: inline-block; transform: rotate(-3deg); background: #ff6fa5; color: #000; border: 3px solid #000; box-shadow: 5px 5px 0 #000; padding: .4rem 1rem; font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: clamp(2.75rem, 10vw, 5rem); line-height: 1.05; margin: 1.2rem 0; text-transform: uppercase; }
      pre { background: #fff; color: #000; border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--line); padding: 1rem; overflow-x: auto; font-size: .85rem; white-space: pre-wrap; }
      a { display: inline-block; margin-top: 1.5rem; background: #b388ff; color: #000; font-weight: 800; text-transform: uppercase; text-decoration: none; padding: .75rem 1.4rem; border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line); transition: transform .12s, box-shadow .12s; }
      a:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 var(--line); }
      a:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--line); }
      a:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>JOIN not found</h1>
      <pre>SELECT * FROM pages WHERE url = 'this-one';
-- 0 rows returned. Somebody forgot the ON clause.</pre>
      <p>That page doesn't exist. The good stuff is on the home page.</p>
      <a href="%BASE_URL%">Take me home</a>
    </main>
  </body>
</html>
